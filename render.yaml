services:
  - type: web
    name: oliyettebook
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: OliyetteBook
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: palaycheck-db
          property: connectionString
      - key: DB_SCHEMA
        value: oliyettebook
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DEMO_ADMIN_EMAIL
        value: admin@oliyettebook.test
      - key: DEMO_ADMIN_PASSWORD
        value: Admin@2026
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_DRIVER
        value: smtp
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        value: c3fbde001@smtp-brevo.com
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: gge086479@gmail.com
      - key: MAIL_FROM_NAME
        value: OliyetteBook
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
